<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:; font-src {{cspSource}};">
  <style>
    body { background: var(--vscode-editor-background); }
    /* chat.css reveals the app once its layout and SVG styles are available. */
    #app { display: none; }
  </style>
  <link rel="stylesheet" href="{{styleUri}}">
  <link rel="stylesheet" href="{{richTextStyleUri}}">
  <title>OpenCode</title>
</head>
<body>
  <template id="provider-icons">{{providerIcons}}</template>
  <div id="app">
    <header id="header">
      <div id="status" class="status connecting">
        <span class="dot" aria-hidden="true"></span>
        <div class="activity-content">
          <div id="status-text" role="status">Connecting…</div>
          <div id="activity-detail" hidden>
            <span id="activity-operation"></span>
            <span id="activity-target"></span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button id="artifacts-toggle" type="button" hidden aria-expanded="false" aria-controls="artifacts">Artifacts</button>
        <button id="activity-jump" type="button" title="Jump to current message" aria-label="Jump to current message" aria-controls="messages">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v10M3.5 8l4.5 4.5L12.5 8"/></svg>
        </button>
      </div>
    </header>
    <button id="plan-progress" type="button" hidden aria-label="Show plan">
      <progress id="plan-meter" max="1" value="0" aria-label="Plan completion"></progress>
      <span id="plan-progress-text" aria-live="polite"></span>
    </button>

    <div id="subagents" class="subagents" hidden>
      <button id="subagents-summary" class="subagents-summary" type="button" aria-expanded="false">
        <span class="subagents-label">Sub-agents</span>
        <span id="subagents-summary-text" class="subagents-summary-text"></span>
        <span class="subagents-chevron" aria-hidden="true">▸</span>
      </button>
      <ul id="subagents-list" class="subagents-list" hidden></ul>
    </div>

    <div id="workspace">
    <div class="edge-fade" data-edge="top" aria-hidden="true"></div>
    <main id="messages" class="messages">
      <div id="empty" class="empty">
        <svg class="empty-logo" viewBox="0 0 512 512" aria-hidden="true">
          <path class="logo-inner" d="M320 224V352H192V224H320Z"/>
          <path class="logo-frame" fill-rule="evenodd" clip-rule="evenodd" d="M384 416H128V96H384V416ZM320 160H192V352H320V160Z"/>
        </svg>
        <h2>OpenCode</h2>
        <p>Ask anything about the current workspace.</p>
      </div>
    </main>
    <aside id="artifacts" aria-label="Artifacts" hidden></aside>
    <div class="edge-fade" data-edge="bottom" aria-hidden="true"></div>
    </div>

    <footer id="composer" class="composer">
      <div id="questions" class="questions" aria-live="polite" hidden></div>
      <div id="slash-menu" class="slash-menu" role="listbox" aria-label="Commands and skills" hidden></div>
      <div id="composer-controls">
      <div class="input-row">
        <div class="input-stack">
          <div id="attachments" class="attachments" hidden></div>
          <div id="selection-context" hidden></div>
          <div class="usage-bar">
            <span id="agent-label" class="agent-label" hidden></span>
            <span id="usage" class="usage-meter" role="img" aria-label="Context usage unknown" tabindex="0">
              <span class="usage-track" aria-hidden="true">
                <span class="usage-fill"></span>
                <span class="usage-cache"></span>
              </span>
              <span class="usage-threshold" aria-hidden="true" hidden></span>
            </span>
            <div class="usage-details">
              <span id="usage-cost" class="usage-item"></span>
              <span id="usage-subscription" class="usage-item" hidden>ChatGPT plan · <a id="usage-link" href="https://chatgpt.com/settings/usage" title="View ChatGPT plan and app usage limits">usage ↗</a></span>
              <span id="usage-reset" class="usage-item"></span>
            </div>
          </div>
          <div class="prompt-box">
            <textarea id="input" rows="1" placeholder="Ask OpenCode…" disabled></textarea>
            <div id="config-bar" class="config-bar" hidden></div>
            <div class="prompt-actions">
              <button id="send" class="btn primary icon-btn" type="button" title="Send" aria-label="Send" disabled>
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M8 2.2 13.8 8h-4.1v5.8H6.3V8H2.2L8 2.2Z"/>
                </svg>
              </button>
              <button id="stop" class="btn danger icon-btn" type="button" title="Stop" aria-label="Stop" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="3.6" y="3.6" width="8.8" height="8.8" rx="1.4"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">
        <span>Enter to send · Shift+Enter for a new line · / commands · @ skills</span>
      </div>
      </div>
    </footer>
  </div>
  <script nonce="{{nonce}}" src="{{richTextUri}}"></script>
  <script nonce="{{nonce}}" src="{{modelPickerUri}}"></script>
  <script id="chat-script" nonce="{{nonce}}" src="{{scriptUri}}" data-diagrams-uri="{{diagramsUri}}"></script>
</body>
</html>
