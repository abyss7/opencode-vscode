name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm test

      - name: Package VSIX
        run: node scripts/package.js

      - name: Attach VSIX to the release
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-sessions-*.vsix
          generate_release_notes: true
